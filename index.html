<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#170d29">
<meta name="color-scheme" content="dark">
<title>DataHacks Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- End islands art + purple scrim, shared by every screen. -->
<div class="backdrop" aria-hidden="true"></div>

<div id="auth-screen">
  <div class="auth-card glass">
    <span class="kicker">DataHacks</span>
    <h1>Check-In</h1>
    <p class="lead">Sign in with an organizer account. Check-in is restricted to event staff.</p>
    <button class="google-btn" id="google-btn" type="button">
      <svg class="google-logo" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="google-btn-label">Sign in with Google</span>
    </button>
    <div class="auth-divider"><span>or use a password</span></div>
    <form class="auth-form" id="login-form">
      <input id="login-email" type="email" autocomplete="username" placeholder="Organizer email" aria-label="Organizer email" required>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
      <button class="primary" type="submit" id="login-btn">Sign in</button>
      <div id="auth-error" role="alert"></div>
    </form>
  </div>
</div>

<div id="boot-screen" class="app-hidden">
  <div class="boot-card glass">
    <div class="pixel-spinner" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="boot-message" role="status">Connecting to database…</div>
  </div>
</div>

<div class="shell app-hidden" id="app">

  <header class="app-bar">
    <div class="brand">
      <span class="brand-kicker" id="brand-kicker">DataHacks</span>
      <h1>Check-In</h1>
    </div>
    <span class="session-email" id="session-email"></span>
    <div class="event-chip" title="Every check-in, undo and roster on this page uses this event">
      <span class="event-chip-dot" aria-hidden="true"></span>
      <span class="event-chip-code current-event-code" aria-hidden="true">—</span>
      <svg class="event-chip-caret" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <select id="event-select" aria-label="Event" disabled>
        <option>—</option>
      </select>
    </div>
    <button class="icon-btn glass" id="sign-out-btn" type="button" aria-label="Sign out">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="views">
    <section class="view active" id="view-scan" aria-label="Scan">
      <div class="scan-panel">
        <div class="event-banner fallback" id="fallback-banner" hidden></div>
        <div id="reader-frame" data-state="idle">
          <video id="scanner-video" playsinline muted autoplay disablepictureinpicture aria-label="Camera preview"></video>
          <!-- Decorative only: the whole camera frame is scanned. -->
          <div class="corners" aria-hidden="true"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
          <div class="cam-hud">
            <span class="live-pill"><i aria-hidden="true"></i><span id="live-label">Scanning</span></span>
            <div class="cam-btns">
              <button class="cam-btn" id="torch-btn" type="button" aria-pressed="false" aria-label="Flashlight" title="Flashlight" hidden>
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>
              </button>
              <button class="cam-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Scan sounds" title="Scan sounds">
                <svg class="snd-on" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <svg class="snd-off" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <button class="cam-btn" id="stop-btn" type="button" disabled>Stop</button>
            </div>
          </div>
          <div id="scanner-overlay" role="status" aria-live="polite">
            <div class="pixel-spinner" aria-hidden="true"><i></i><i></i><i></i></div>
            <p id="scanner-message">Camera is off. Start it to scan passes.</p>
            <button class="primary" id="start-btn" type="button">Start camera</button>
            <button class="primary" id="scanner-retry" type="button" hidden>Retry</button>
          </div>
        </div>
        <div id="status-card" class="info" aria-live="polite"></div>
        <form class="manual" id="manual-form" autocomplete="off">
          <label class="visually-hidden" for="manual-input">Attendee code or email</label>
          <input id="manual-input" type="text" placeholder="Code or email" enterkeyhint="go"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="primary" id="manual-btn" type="submit">Check in</button>
        </form>
        <div class="recent" id="recent">
          <div class="recent-inner">
            <h2 class="section-label" id="recent-label">Recent</h2>
            <ul class="recent-list" id="recent-list" aria-labelledby="recent-label"></ul>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-hacker" data-role="hacker" aria-label="Hackers"></section>
    <section class="view" id="view-judge" data-role="judge" aria-label="Judges"></section>
    <section class="view" id="view-mentor" data-role="mentor" aria-label="Mentors"></section>
  </main>

  <nav class="tabs glass" aria-label="Sections" style="--tab-i:0">
    <span class="tab-pill" aria-hidden="true"></span>
    <button class="tab-btn active" data-view="scan" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5M7 12h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
      <span>Scan</span>
    </button>
    <button class="tab-btn" data-view="hacker" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v8H8zM5 13h14v8H5z" fill="currentColor"/></svg>
      <span>Hackers</span>
    </button>
    <button class="tab-btn" data-view="judge" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v2h-2zM4 5h16v2H4zM5 9h2v6H5zM3 15h6v2H3zM17 9h2v6h-2zM15 15h6v2h-6zM11 7h2v12h-2zM7 19h10v2H7z" fill="currentColor"/></svg>
      <span>Judges</span>
    </button>
    <button class="tab-btn" data-view="mentor" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v4H4zM6 7h12v6H6zM10 13h4v4h-4zM7 17h10v4H7z" fill="currentColor"/></svg>
      <span>Mentors</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
