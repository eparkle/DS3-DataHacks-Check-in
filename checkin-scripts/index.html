<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataHacks Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0A1628;
    --surface:#101E36;
    --surface-alt:#16294A;
    --border:#22304A;
    --text:#EAF0FB;
    --muted:#7C8CAE;
    --accent:#F2B705;
    --accent-dim:#8A6A1C;
    --success:#34D399;
    --success-dim:#123328;
    --error:#F87171;
    --error-dim:#3A1A1A;
    --mentor:#C084FC;
    --mentor-dim:#2E2140;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 20% -10%, #132845 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:24px;
  }
  .wrap{ max-width:1180px; margin:0 auto; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:16px;
    padding-bottom:20px; margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.5rem; font-weight:700; letter-spacing:-0.01em;
  }
  .brand span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:2px 8px; border-radius:999px;
  }

  nav{ display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:10px; border:1px solid var(--border); flex-wrap:wrap; }
  nav button{
    font-family:'Inter', sans-serif; font-size:0.85rem; font-weight:500;
    background:transparent; border:none; color:var(--muted);
    padding:8px 16px; border-radius:7px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav button.active{ background:var(--surface-alt); color:var(--text); }
  nav button:hover:not(.active){ color:var(--text); }

  .view{ display:none; }
  .view.active{ display:block; }

  .scan-grid{ display:flex; justify-content:center; }
  .scan-grid .panel{ width:100%; max-width:520px; }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px;
  }
  .panel h2{
    font-family:'Space Grotesk', sans-serif; font-size:1rem; font-weight:600;
    margin-bottom:14px;
  }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px;
  }
  .panel-head h2{ margin-bottom:0; }
  .count-line{
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--muted);
  }
  .count-line b{ color:var(--text); }

  #reader-frame{
    position:relative; border-radius:14px; overflow:hidden;
    background:#000; aspect-ratio:1/1; max-height:420px; margin:0 auto;
  }
  #reader{ width:100%; height:100%; }
  #reader video{ object-fit:cover; }
  .corners span{
    position:absolute; width:28px; height:28px; border:3px solid var(--accent);
    z-index:5; pointer-events:none;
  }
  .corners .tl{ top:14px; left:14px; border-right:none; border-bottom:none; border-radius:4px 0 0 0;}
  .corners .tr{ top:14px; right:14px; border-left:none; border-bottom:none; border-radius:0 4px 0 0;}
  .corners .bl{ bottom:14px; left:14px; border-right:none; border-top:none; border-radius:0 0 0 4px;}
  .corners .br{ bottom:14px; right:14px; border-left:none; border-top:none; border-radius:0 0 4px 0;}

  .scan-controls{ display:flex; gap:10px; margin-top:14px; }
  button.primary, button.ghost{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.85rem;
    padding:10px 18px; border-radius:9px; cursor:pointer; border:1px solid transparent;
  }
  button.primary{ background:var(--accent); color:#1A1300; }
  button.primary:hover{ filter:brightness(1.08); }
  button.ghost{ background:transparent; border-color:var(--border); color:var(--text); }
  button.ghost:hover{ background:var(--surface-alt); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  #status-card{
    margin-top:16px; padding:16px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-alt); min-height:64px;
    display:flex; align-items:center; gap:14px;
  }
  #status-card.success{ border-color:var(--success); background:var(--success-dim); }
  #status-card.error{ border-color:var(--error); background:var(--error-dim); }
  #status-card .icon{ font-size:1.6rem; }
  #status-card .name{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.05rem; }
  #status-card .meta{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--muted); margin-top:2px; }
  #status-card .placeholder{ color:var(--muted); font-size:0.85rem; }

  .manual{ margin-top:16px; display:flex; gap:8px; }
  .manual input{
    flex:1; background:var(--bg); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; color:var(--text); font-family:'Inter'; font-size:0.85rem;
  }
  .manual input:focus{ outline:2px solid var(--accent-dim); }

  .badge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.65rem;
    padding:2px 8px; border-radius:999px;
  }
  .badge.participant{ background:#1E2E4E; color:#9CB8F2; }
  .badge.judge{ background:#3A2A12; color:var(--accent); }
  .badge.mentor{ background:var(--mentor-dim); color:var(--mentor); }

  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    color:var(--muted); font-weight:500; padding:10px 12px; border-bottom:1px solid var(--border);
  }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.in{ background:var(--success); }
  .dot.out{ background:var(--muted); }
  .empty-row td{ color:var(--muted); text-align:center; padding:24px; font-family:'IBM Plex Mono', monospace; font-size:0.8rem; }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; color:var(--text); font-family:'Inter'; font-size:0.82rem;
  }
  .toolbar input{ flex:1; min-width:160px; }

  .note{ font-size:0.78rem; color:var(--muted); margin-top:14px; line-height:1.5; text-align:center; }

  #boot-screen{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font-family:'IBM Plex Mono', monospace; color:var(--muted); text-align:center; padding:20px;
  }
  #boot-screen.error{ color:var(--error); }
  #boot-screen .spinner{
    width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="boot-screen">
  <div class="spinner"></div>
  <div id="boot-message">Connecting to database…</div>
</div>

<div class="wrap">

  <header>
    <div class="brand">
      <h1>DataHacks Check-In</h1>
      <span>PROTOTYPE</span>
    </div>
    <nav>
      <button class="tab-btn active" data-view="scan">Scan</button>
      <button class="tab-btn" data-view="participant">Participants</button>
      <button class="tab-btn" data-view="judge">Judges</button>
      <button class="tab-btn" data-view="mentor">Mentors</button>
    </nav>
  </header>

  <!-- SCAN TO CHECK IN -->
  <div class="view active" id="view-scan">
    <div class="scan-grid">
      <div class="panel">
        <h2>Camera scanner</h2>
        <div id="reader-frame">
          <div id="reader"></div>
          <div class="corners"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
        </div>
        <div class="scan-controls">
          <button class="primary" id="start-btn">Start camera</button>
          <button class="ghost" id="stop-btn" disabled>Stop</button>
        </div>
        <div id="status-card">
          <div class="placeholder">Waiting for first scan…</div>
        </div>
        <div class="manual">
          <input id="manual-input" placeholder="Or type / paste a code manually, then press Enter">
        </div>
        <p class="note">Works for participants, judges, and mentors — the code itself determines who it is.</p>
      </div>
    </div>
  </div>

  <!-- PARTICIPANTS / JUDGES / MENTORS -->
  <div class="view" id="view-participant" data-role="participant"></div>
  <div class="view" id="view-judge" data-role="judge"></div>
  <div class="view" id="view-mentor" data-role="mentor"></div>

</div>

<script type="module">
// ---------- Firebase config ----------
// From Firebase console → Project settings → General → Your apps → SDK setup.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, doc, runTransaction, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2tWlDVwRk6vw8nZzUMeibbqSTkBZSHT8",
  authDomain: "datahacks-check-in.firebaseapp.com",
  projectId: "datahacks-check-in",
  storageBucket: "datahacks-check-in.firebasestorage.app",
  messagingSenderId: "443565276738",
  appId: "1:443565276738:web:55f7a28d120e6bd69737db",
  measurementId: "G-0ZY0TWEZX0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const registrantsCol = collection(db, "registrants");
const ROLES = ["participant", "judge", "mentor"];

let roster = [];
let lastScanId = null, lastScanTime = 0;
let html5QrCode = null;

// Firestore stores each registrant as a document whose ID *is* the check-in
// code (e.g. "DH26-P001") - that's what gets encoded in the QR and typed manually.
function docToPerson(id, data){
  return {
    id,
    name: data.name,
    role: data.role,
    team: data.team,
    checkedIn: !!data.checkedIn,
    at: data.checkedInAt
      ? new Date(data.checkedInAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : null
  };
}

function escapeHtml(s){
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

// ---------- Boot / realtime sync ----------
function boot(){
  const bootScreen = document.getElementById("boot-screen");
  const bootMessage = document.getElementById("boot-message");
  const q = query(registrantsCol, orderBy("name"));

  onSnapshot(q, (snapshot)=>{
    roster = snapshot.docs.map(d => docToPerson(d.id, d.data()));

    ROLES.forEach(role=>{
      if(document.getElementById("view-"+role).classList.contains("active")) renderRoleView(role);
    });

    if(roster.length === 0){
      bootMessage.innerHTML = `Connected, but the "registrants" collection is empty.<br>Add documents in Firestore and they'll appear here automatically.`;
      return; // leave boot screen up with this message until data shows up
    }
    if(bootScreen.isConnected) bootScreen.remove();
  }, (error)=>{
    bootScreen.classList.add("error");
    bootMessage.innerHTML = `Couldn't reach Firestore.<br><span style="font-size:0.7rem">${escapeHtml(String(error.message || error))}</span><br><br>Check firebaseConfig and your Firestore security rules.`;
  });
}

// ---------- Tabs ----------
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    const view = document.getElementById("view-"+btn.dataset.view);
    view.classList.add("active");
    if(ROLES.includes(btn.dataset.view)) renderRoleView(btn.dataset.view);
  });
});

// ---------- Check-in logic ----------
async function processCode(rawText){
  const id = rawText.trim().toUpperCase();
  const now = Date.now();
  if(id === lastScanId && now - lastScanTime < 3000) return; // debounce repeat reads
  lastScanId = id; lastScanTime = now;

  const card = document.getElementById("status-card");
  card.className = "";
  card.innerHTML = `<div class="placeholder">Looking up ${escapeHtml(id)}…</div>`;

  const ref = doc(db, "registrants", id);
  let result;
  try{
    // A transaction reads-then-writes atomically, so if two stations scan the
    // same badge at once, only one can win the "checkedIn is still false" check.
    result = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      if(!snap.exists()) return { status: "unknown" };
      const data = snap.data();
      if(data.checkedIn) return { status: "dupe", person: docToPerson(id, data) };
      const nowIso = new Date().toISOString();
      tx.update(ref, { checkedIn: true, checkedInAt: nowIso });
      return { status: "ok", person: docToPerson(id, { ...data, checkedIn: true, checkedInAt: nowIso }) };
    });
  }catch(err){
    card.className = "error";
    card.innerHTML = `<div class="icon">🚫</div><div><div class="name">Database error</div><div class="meta">${escapeHtml(String(err.message || err))}</div></div>`;
    return;
  }

  if(result.status === "unknown"){
    card.className = "error";
    card.innerHTML = `<div class="icon">⚠️</div><div><div class="name">Unrecognized code</div><div class="meta">"${escapeHtml(rawText)}" doesn't match any registrant</div></div>`;
    return;
  }

  if(result.status === "dupe"){
    const p = result.person;
    card.className = "error";
    card.innerHTML = `<div class="icon">↩️</div><div><div class="name">${p.name} — already checked in</div><div class="meta">${p.role.toUpperCase()} · at ${p.at}</div></div>`;
    return;
  }

  const finalPerson = result.person;
  card.className = "success";
  card.innerHTML = `<div class="icon">✅</div><div><div class="name">${finalPerson.name}</div><div class="meta">${finalPerson.role.toUpperCase()} · ${finalPerson.team || ""} · checked in ${finalPerson.at}</div></div>`;

  const idx = roster.findIndex(r => r.id === finalPerson.id);
  if(idx > -1) roster[idx] = finalPerson; else roster.push(finalPerson);
  if(document.getElementById("view-"+finalPerson.role).classList.contains("active")) renderRoleView(finalPerson.role);
}

// ---------- Manual entry ----------
document.getElementById("manual-input").addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target.value.trim()){
    processCode(e.target.value);
    e.target.value = "";
  }
});

// ---------- Camera scanner ----------
document.getElementById("start-btn").addEventListener("click", async ()=>{
  const startBtn = document.getElementById("start-btn");
  const stopBtn = document.getElementById("stop-btn");
  try{
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText)=> processCode(decodedText),
      ()=>{} // ignore per-frame scan failures
    );
    startBtn.disabled = true;
    stopBtn.disabled = false;
  }catch(err){
    const card = document.getElementById("status-card");
    card.className = "error";
    card.innerHTML = `<div class="icon">🚫</div><div><div class="name">Camera unavailable</div><div class="meta">${escapeHtml(String(err))}. Check camera permissions, or use manual entry below.</div></div>`;
  }
});

document.getElementById("stop-btn").addEventListener("click", async ()=>{
  if(html5QrCode){
    await html5QrCode.stop();
    html5QrCode.clear();
  }
  document.getElementById("start-btn").disabled = false;
  document.getElementById("stop-btn").disabled = true;
});

// ---------- Role tabs (Participants / Judges / Mentors) ----------
const ROLE_LABELS = { participant: "Participants", judge: "Judges", mentor: "Mentors" };

// Build the static markup for each role tab once.
ROLES.forEach(role=>{
  const view = document.getElementById("view-"+role);
  view.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${ROLE_LABELS[role]}</h2>
        <div class="count-line" id="${role}-count">— / —</div>
      </div>
      <div class="toolbar">
        <input id="${role}-search" placeholder="Search by name or ID…">
        <select id="${role}-status-filter">
          <option value="all">All</option>
          <option value="in">Checked in</option>
          <option value="out">Not checked in</option>
        </select>
        <button class="ghost" id="${role}-export-btn">Export CSV</button>
      </div>
      <table>
        <thead><tr><th>Status</th><th>Name</th><th>ID</th><th>Team</th><th>Checked in at</th><th></th></tr></thead>
        <tbody id="${role}-body"></tbody>
      </table>
    </div>
  `;
  document.getElementById(`${role}-search`).addEventListener("input", ()=>renderRoleView(role));
  document.getElementById(`${role}-status-filter`).addEventListener("change", ()=>renderRoleView(role));
  document.getElementById(`${role}-export-btn`).addEventListener("click", ()=>exportRole(role));
});

function renderRoleView(role){
  const all = roster.filter(r => r.role === role);
  const search = document.getElementById(`${role}-search`).value.toLowerCase();
  const statusFilter = document.getElementById(`${role}-status-filter`).value;

  const checkedInCount = all.filter(r=>r.checkedIn).length;
  document.getElementById(`${role}-count`).innerHTML = `<b>${checkedInCount}</b> / ${all.length} checked in`;

  const filtered = all
    .filter(p => statusFilter === "all" || (statusFilter === "in" ? p.checkedIn : !p.checkedIn))
    .filter(p => p.name.toLowerCase().includes(search) || p.id.toLowerCase().includes(search));

  const body = document.getElementById(`${role}-body`);
  body.innerHTML = "";

  if(filtered.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No ${ROLE_LABELS[role].toLowerCase()} match this view.</td></tr>`;
    return;
  }

  filtered.forEach(p=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="dot ${p.checkedIn ? 'in':'out'}"></span>${p.checkedIn ? 'Checked in' : 'Not yet'}</td>
      <td>${p.name}</td>
      <td style="font-family:'IBM Plex Mono',monospace; font-size:0.75rem;">${p.id}</td>
      <td>${p.team || '—'}</td>
      <td>${p.at || '—'}</td>
      <td>${p.checkedIn ? '' : `<button class="ghost" data-id="${p.id}" style="padding:5px 10px; font-size:0.75rem;">Check in</button>`}</td>
    `;
    body.appendChild(tr);
  });

  body.querySelectorAll("button[data-id]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{ await processCode(btn.dataset.id); renderRoleView(role); });
  });
}

function exportRole(role){
  const rows = roster.filter(r => r.role === role);
  const out = [["Name","ID","Team","Checked In","Time"]];
  rows.forEach(p => out.push([p.name, p.id, p.team, p.checkedIn ? "yes":"no", p.at || ""]));
  const csv = out.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `datahacks-${role}s-export.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ---------- Init ----------
boot();
</script>
</body>
</html>
